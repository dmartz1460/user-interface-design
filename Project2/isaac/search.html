<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search header mockup</title>
    <link rel="stylesheet" href="mockups.css">
    <script src="mockups.js" defer></script>
  </head>
  <body class="search-preview">
    <main class="search-card" aria-label="Search">
      <nav class="search-tabs" aria-label="Search categories">
        <button class="search-tab is-active" type="button" aria-current="page" data-category="locations"><span class="dot dot-location" aria-hidden="true"></span>Locations</button>
        <button class="search-tab" type="button" data-category="events"><span class="dot dot-event" aria-hidden="true"></span>Events</button>
        <button class="search-tab" type="button" data-category="organizations"><span class="dot dot-org" aria-hidden="true"></span>Organizations</button>
        <button class="search-tab" type="button" data-category="history">History</button>
      </nav>
      <div class="search-content">
        <label class="search-input">
          <span class="search-icon" aria-hidden="true"></span>
          <input type="search" aria-label="Search locations" placeholder="Search locations">
        </label>
        <!-- Sample options and initial selections; replace with the application's location filters. -->
        <div class="location-filters" aria-label="Location filters">
          <details class="filter-menu" data-filter="Spaces">
            <summary><span>Spaces: 2</span></summary>
            <fieldset>
              <legend>Spaces</legend>
              <label><input type="checkbox" checked> Single space</label>
              <label><input type="checkbox" checked> Multiple spaces</label>
            </fieldset>
          </details>
          <details class="filter-menu" data-filter="Features">
            <summary><span>Features +</span></summary>
            <fieldset>
              <legend>Features</legend>
              <label><input type="checkbox"> Projector</label>
              <label><input type="checkbox"> Whiteboard</label>
              <label><input type="checkbox"> Zoom</label>
            </fieldset>
          </details>
          <details class="filter-menu" data-filter="Layouts">
            <summary><span>Layouts +</span></summary>
            <fieldset>
              <legend>Layouts</legend>
              <label><input type="checkbox"> Classroom</label>
              <label><input type="checkbox"> Lecture</label>
              <label><input type="checkbox"> Seminar</label>
            </fieldset>
          </details>
          <details class="filter-menu" data-filter="Capacity">
            <summary><span>Capacity +</span></summary>
            <fieldset>
              <legend>Minimum capacity</legend>
              <label><input type="radio" name="capacity" value="10"> 10</label>
              <label><input type="radio" name="capacity" value="25"> 25</label>
              <label><input type="radio" name="capacity" value="50"> 50</label>
            </fieldset>
          </details>
          <button class="clear-filters" type="button">Clear</button>
        </div>
        <section class="search-history" aria-labelledby="history-title" hidden>
          <h1 id="history-title">History</h1>
          <p>Your 10 latest searches</p>
          <div class="recent-browser" data-recents></div>
        </section>
      </div>
    </main>
  </body>
</html>
