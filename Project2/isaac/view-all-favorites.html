<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View all favorites mockup</title>
    <link rel="stylesheet" href="mockups.css">
    <script src="mockups.js" defer></script>
  </head>
  <body class="popup-preview">
    <main class="popup recents" aria-labelledby="recents-title">
      <header class="recents-header">
        <div>
          <h1 id="recents-title">Favorites</h1>
          <p>Your saved items</p>
        </div>
        <button class="close-button" type="button" aria-label="Close favorites" aria-disabled="true">&times;</button>
      </header>
      <!-- Populated by the favorites renderer in mockups.js. -->
      <div class="recent-browser" data-favorites></div>
    </main>
  </body>
</html>
